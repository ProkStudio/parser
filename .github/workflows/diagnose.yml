name: Inspect desktop build diagnostics
on:
  push:
    branches: [feat/noir-windows-app]
    paths: [.github/workflows/diagnose.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/noir-windows-app
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Audit the verified transfer without publishing application changes
        run: |
          python tools/restore_sources.py
          python - <<'PY'
          from pathlib import Path
          import json
          found = []
          for root in (Path('parser_app'), Path('tests'), Path('README.md'), Path('RELEASE_NOTES.md')):
              for p in (root.rglob('*') if root.is_dir() else [root]):
                  if not p.is_file() or p.suffix not in {'.py', '.js', '.html', '.css', '.md'}:
                      continue
                  for number, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1):
                      if '\ufffd' in line:
                          found.append({'path': str(p), 'line': number, 'text': line.replace('\ufffd', '<U+FFFD>')})
          Path('.ci').mkdir(exist_ok=True)
          Path('.ci/ui-text-audit.json').write_text(json.dumps(found, ensure_ascii=False, indent=2), encoding='utf-8')
          PY
      - name: Record the failed build log without modifying application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          gh run view 34151201347 --repo "$GITHUB_REPOSITORY" --log-failed > .ci/desktop-build-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/desktop-build-diagnostics.txt .ci/ui-text-audit.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record desktop build diagnostics [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
