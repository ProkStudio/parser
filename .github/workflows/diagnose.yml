name: Inspect desktop build diagnostics
on:
  push:
    branches: [feat/noir-windows-app]
    paths: [.github/workflows/diagnose.yml]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/noir-windows-app
      - name: Record the failed build log without modifying application code
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          gh run view 34151201347 --repo "$GITHUB_REPOSITORY" --log-failed > .ci/desktop-build-diagnostics.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .ci/desktop-build-diagnostics.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record desktop build diagnostics [skip ci]'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
